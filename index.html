<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>EstudiApp - Organizador Académico</title>
    <style>
        /* --- ESTILOS MINIMALISTAS --- */
        :root {
            --bg-color: #F4F6F8;
            --card-bg: #FFFFFF;
            --text-main: #2C3E50;
            --text-sub: #7F8C8D;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 20px;
            --primary: #2980B9;
            --secondary: #8E44AD;
            --tertiary: #E67E22;
            --border-color: #E0E0E0;
            --input-bg: #FAFAFA;
            --danger: #e74c3c;
            --success: #27ae60;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding-bottom: 80px;
        }

        /* HEADER */
        .app-header { 
            background: var(--card-bg); 
            padding: 20px 20px 12px;
            text-align: center; 
            box-shadow: var(--shadow);
            position: sticky; 
            top: 0; 
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }
        .header-title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            flex-direction: column;
        }
        h1 { 
            font-size: 1.8rem; 
            font-weight: 800; 
            color: var(--primary); 
            letter-spacing: -0.5px;
            margin: 0;
        }
        .subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-style: italic;
            margin-top: 4px;
        }

        /* NAVEGACIÓN (10 MATERIAS) */
        .nav-scroll {
            display: flex; 
            gap: 10px; 
            overflow-x: auto;
            padding: 15px 20px; 
            background: var(--bg-color);
            scrollbar-width: thin;
            white-space: nowrap;
        }
        .nav-scroll::-webkit-scrollbar { height: 4px; }
        .nav-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }

        .nav-btn {
            background: var(--card-bg); 
            border: 1px solid var(--border-color);
            color: var(--text-sub); 
            padding: 10px 20px; 
            border-radius: 40px;
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .nav-btn.active {
            background: var(--primary); 
            color: white; 
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(41, 128, 185, 0.25);
        }
        .nav-btn:hover:not(.active) { background: #ecf0f1; transform: translateY(-1px); }

        /* CONTENEDOR PRINCIPAL */
        main { padding: 20px 16px; max-width: 900px; margin: 0 auto; }

        /* BARRA DE BÚSQUEDA */
        .search-bar {
            margin-bottom: 24px;
        }
        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            font-size: 0.95rem;
            background-color: white;
            transition: all 0.2s;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(41,128,185,0.1);
        }

        /* FORMULARIO DE AGREGAR */
        .add-card {
            background: var(--card-bg); 
            border-radius: var(--radius);
            padding: 20px; 
            box-shadow: var(--shadow); 
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            transition: box-shadow 0.2s;
        }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input {
            width: 100%; padding: 12px 14px; border-radius: 14px;
            border: 1px solid var(--border-color); background: var(--input-bg);
            font-size: 0.95rem; transition: 0.2s;
        }
        .form-input:focus { outline: none; border-color: var(--primary); background: white; }
        
        .file-upload-wrapper {
            position: relative; 
            display: inline-block; 
            width: 100%;
        }
        .file-upload-btn {
            border: 1px solid var(--border-color); 
            background: white; 
            padding: 12px; 
            border-radius: 14px;
            font-size: 0.9rem; 
            cursor: pointer; 
            width: 100%; 
            text-align: center;
            font-weight: 500;
            transition: background 0.2s;
        }
        .file-upload-btn:hover { background: #f8f9fa; }
        .file-upload-input[type=file] {
            position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
        }

        .btn-submit {
            width: 100%; padding: 14px; background: var(--primary);
            color: white; border: none; border-radius: 14px; font-weight: bold;
            font-size: 1rem; cursor: pointer; margin-top: 12px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #1a5d8c; }

        /* TARJETAS DE RECURSOS */
        .content-card {
            background: var(--card-bg); 
            border-radius: var(--radius);
            box-shadow: var(--shadow); 
            padding: 18px; 
            margin-bottom: 20px;
            position: relative; 
            animation: fadeIn 0.3s ease;
            border-left: 5px solid var(--primary);
            transition: transform 0.1s;
        }
        .content-card.type-video { border-left-color: var(--secondary); }
        .content-card.type-file { border-left-color: var(--tertiary); }
        .content-card.type-image { border-left-color: var(--success); }
        .content-card.editing-mode { border: 2px solid var(--primary); border-left: 5px solid var(--primary); }

        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; color: var(--text-main); word-break: break-word; padding-right: 70px; }

        .media-preview {
            width: 100%; 
            border-radius: 14px; 
            overflow: hidden; 
            background: #f1f2f6; 
            margin: 12px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 180px;
        }
        .media-preview iframe, .media-preview video, .media-preview img { width: 100%; border: none; border-radius: 12px; max-height: 280px; object-fit: contain; }
        .pdf-iframe { width: 100%; height: 280px; border: none; background: #fff; border-radius: 12px; }

        .action-buttons {
            position: absolute; top: 16px; right: 16px;
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 6px;
            border-radius: 8px;
            transition: all 0.2s;
            color: var(--text-sub);
        }
        .icon-btn:hover { background: #ecf0f1; }
        .delete-btn:hover { color: var(--danger); }
        .edit-btn:hover { color: var(--primary); }

        .link-tag {
            display: inline-block; background: #eef2f5; padding: 5px 10px; border-radius: 20px;
            font-size: 0.7rem; color: #2c3e50; margin-top: 8px; word-break: break-all;
        }

        /* MODO EDICIÓN */
        .edit-form {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        .edit-field {
            margin-bottom: 12px;
        }
        .edit-field input, .edit-field textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .edit-file-row {
            margin: 12px 0;
        }
        .save-edit-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-right: 8px;
        }
        .cancel-edit-btn {
            background: #e0e0e0;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .empty-state {
            text-align: center; color: var(--text-sub); margin-top: 30px; 
            padding: 40px; background: #f9f9f9; border-radius: 28px;
            font-style: italic;
        }

        /* FOOTER */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            padding: 10px 16px;
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-sub);
            border-top: 1px solid var(--border-color);
            z-index: 99;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 550px) {
            .nav-btn { padding: 6px 14px; font-size: 0.75rem; }
            .card-title { font-size: 1rem; padding-right: 60px; }
            .pdf-iframe { height: 200px; }
        }
    </style>
</head>
<body>

<div class="app-header">
    <div class="header-title-wrapper">
        <h1>EstudiApp</h1>
        <div class="subtitle">Estudiá, no seas policía</div>
    </div>
</div>

<!-- Navegación de las 10 materias -->
<nav class="nav-scroll" id="nav-container"></nav>

<main id="app-container"></main>

<div class="footer">
    ⚠️ Prohibido el uso de esta aplicación o este código para policías, servicios de inteligencia y para sus familiares directos.
</div>

<script>
    // --- CONFIGURACIÓN: 10 MATERIAS ---
    const DEFAULT_SUBJECTS = [
        "Matemáticas", "Lengua y Literatura", "Ciencias Naturales", "Historia",
        "Geografía", "Física", "Química", "Inglés / Idiomas", "Filosofía", "Arte"
    ];
    
    let subjectsList = [...DEFAULT_SUBJECTS];
    let appData = {};
    let currentSubject = subjectsList[0];
    let searchTerm = "";
    let editingResourceId = null;
    
    // --- Cargar desde localStorage ---
    function loadFromStorage() {
        const storedSubjects = localStorage.getItem('estudiApp_subjects');
        if (storedSubjects) {
            subjectsList = JSON.parse(storedSubjects);
        } else {
            subjectsList = [...DEFAULT_SUBJECTS];
        }
        
        const storedData = localStorage.getItem('estudiApp_materials_v3');
        if (storedData) {
            appData = JSON.parse(storedData);
        } else {
            appData = {};
        }
        
        subjectsList.forEach(sub => {
            if (!appData[sub]) appData[sub] = [];
        });
        
        for (let key in appData) {
            if (!subjectsList.includes(key)) {
                delete appData[key];
            }
        }
    }
    
    function saveSubjects() {
        localStorage.setItem('estudiApp_subjects', JSON.stringify(subjectsList));
    }
    
    function saveMaterials() {
        localStorage.setItem('estudiApp_materials_v3', JSON.stringify(appData));
    }
    
    function persistAll() {
        saveSubjects();
        saveMaterials();
    }
    
    // --- Helper: convertir archivo a Base64 ---
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }
    
    // --- Detectar tipo de archivo ---
    function getFileMediaType(file) {
        if (file.type.startsWith('image/')) return 'image';
        if (file.type.startsWith('video/')) return 'video';
        if (file.type === 'application/pdf') return 'pdf';
        return 'other';
    }
    
    // --- Extraer ID de YouTube ---
    function extractYouTubeID(url) {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }
    
    // --- Renderizar navegación ---
    function renderNav() {
        const navContainer = document.getElementById('nav-container');
        navContainer.innerHTML = '';
        subjectsList.forEach((subject) => {
            const btn = document.createElement('button');
            btn.className = `nav-btn ${subject === currentSubject ? 'active' : ''}`;
            btn.innerText = subject.length > 18 ? subject.slice(0,15)+'..' : subject;
            btn.title = subject;
            btn.onclick = () => {
                currentSubject = subject;
                searchTerm = "";
                editingResourceId = null;
                renderNav();
                renderMain();
            };
            navContainer.appendChild(btn);
        });
    }
    
    // --- Editar título de materia ---
    function showEditSubjectDialog() {
        const newTitle = prompt("Editar nombre de la materia:", currentSubject);
        if (newTitle && newTitle.trim() !== "" && newTitle !== currentSubject) {
            const trimmed = newTitle.trim();
            if (subjectsList.includes(trimmed)) {
                alert("Ya existe una materia con ese nombre. Elige otro.");
                return;
            }
            const oldSubject = currentSubject;
            const index = subjectsList.indexOf(oldSubject);
            if (index !== -1) {
                subjectsList[index] = trimmed;
                if (appData[oldSubject]) {
                    appData[trimmed] = appData[oldSubject];
                    delete appData[oldSubject];
                } else {
                    appData[trimmed] = [];
                }
                currentSubject = trimmed;
                persistAll();
                renderNav();
                renderMain();
            }
        }
    }
    
    // --- Agregar recurso ---
    async function addResource(title, videoLink, docLink, localFile) {
        if (!title) {
            alert("Por favor, ingresa un título para el recurso.");
            return false;
        }
        
        if (!videoLink && !docLink && !localFile) {
            alert("Debes proporcionar al menos un enlace de video, un enlace de documento o subir un archivo.");
            return false;
        }
        
        const newItem = {
            id: Date.now() + Math.random() * 1000,
            title: title,
            video: videoLink || null,
            pdfUrl: docLink || null,
            fileData: null,
            fileType: null,
            fileName: null
        };
        
        if (localFile) {
            const allowedTypes = ['application/pdf', 'image/jpeg', 'image/png', 'image/gif', 'image/webp', 'video/mp4', 'video/quicktime', 'video/webm'];
            if (!allowedTypes.includes(localFile.type)) {
                alert("Formato no soportado. Permitidos: PDF, imágenes (jpg, png, gif, webp) y videos (mp4, mov, webm)");
                return false;
            }
            if (localFile.size > 30 * 1024 * 1024) {
                if (!confirm("El archivo es grande (>30MB). Puede afectar el rendimiento. ¿Continuar?")) return false;
            }
            try {
                newItem.fileData = await fileToBase64(localFile);
                newItem.fileType = getFileMediaType(localFile);
                newItem.fileName = localFile.name;
            } catch (err) {
                alert("Error al leer el archivo");
                return false;
            }
        }
        
        if (!appData[currentSubject]) appData[currentSubject] = [];
        appData[currentSubject].push(newItem);
        persistAll();
        return true;
    }
    
    // --- Actualizar recurso (edición) ---
    async function updateResource(resourceId, updatedTitle, updatedVideo, updatedDocLink, newFile) {
        const resources = appData[currentSubject];
        const index = resources.findIndex(r => r.id === resourceId);
        if (index === -1) return false;
        
        const updated = { ...resources[index] };
        updated.title = updatedTitle;
        updated.video = updatedVideo || null;
        updated.pdfUrl = updatedDocLink || null;
        
        if (newFile) {
            const allowedTypes = ['application/pdf', 'image/jpeg', 'image/png', 'image/gif', 'image/webp', 'video/mp4', 'video/quicktime', 'video/webm'];
            if (!allowedTypes.includes(newFile.type)) {
                alert("Formato no soportado para el nuevo archivo");
                return false;
            }
            try {
                updated.fileData = await fileToBase64(newFile);
                updated.fileType = getFileMediaType(newFile);
                updated.fileName = newFile.name;
            } catch (err) {
                alert("Error al leer el archivo");
                return false;
            }
        }
        
        appData[currentSubject][index] = updated;
        persistAll();
        return true;
    }
    
    // --- Eliminar recurso ---
    function deleteResource(resourceId) {
        if (confirm("¿Eliminar este recurso permanentemente?")) {
            if (appData[currentSubject]) {
                appData[currentSubject] = appData[currentSubject].filter(i => i.id !== resourceId);
                persistAll();
                if (editingResourceId === resourceId) editingResourceId = null;
                renderMain();
            }
        }
    }
    
    // --- Renderizar preview del recurso ---
    function renderResourcePreview(item) {
        if (item.video && item.video.trim() !== "") {
            const youtubeId = extractYouTubeID(item.video);
            if (youtubeId) {
                return `<div class="media-preview"><iframe src="https://www.youtube.com/embed/${youtubeId}" frameborder="0" allowfullscreen style="width:100%; height:220px; border-radius:12px;"></iframe></div><div class="link-tag">🎥 Video (YouTube)</div>`;
            } else {
                return `<div class="media-preview" style="padding:20px; text-align:center;"><a href="${escapeHtml(item.video)}" target="_blank" rel="noopener" style="color:var(--primary);">🔗 Abrir video externo</a><br><small>No se puede incrustar</small></div><div class="link-tag">🎥 Enlace de video</div>`;
            }
        }
        else if (item.fileData) {
            if (item.fileType === 'image') {
                return `<div class="media-preview"><img src="${item.fileData}" alt="imagen" style="max-width:100%; max-height:250px; object-fit:contain;"></div><div class="link-tag">🖼️ Imagen • ${escapeHtml(item.fileName || 'archivo')}</div>`;
            } else if (item.fileType === 'video') {
                return `<div class="media-preview"><video controls style="width:100%; max-height:250px;"><source src="${item.fileData}" type="video/mp4"></video></div><div class="link-tag">🎬 Video local • ${escapeHtml(item.fileName || 'video')}</div>`;
            } else if (item.fileType === 'pdf') {
                return `<div class="media-preview"><iframe class="pdf-iframe" src="${item.fileData}#toolbar=0" title="PDF local"></iframe></div><div class="link-tag">📄 Documento PDF • ${escapeHtml(item.fileName || 'documento')}</div>`;
            }
        }
        else if (item.pdfUrl && item.pdfUrl.trim() !== "") {
            return `<div class="media-preview" style="background:#f8f9fa; padding:16px; text-align:center;"><a href="${escapeHtml(item.pdfUrl)}" target="_blank" rel="noopener" style="background:var(--tertiary); color:white; padding:8px 20px; border-radius:40px; text-decoration:none; display:inline-block;">📑 Abrir documento externo</a></div><div class="link-tag">🔗 Enlace web</div>`;
        }
        return `<div class="link-tag">⚠️ Sin contenido multimedia visible</div>`;
    }
    
    // --- Renderizar modo edición ---
    function renderEditMode(item, cardElement) {
        const editDiv = document.createElement('div');
        editDiv.className = 'edit-form';
        editDiv.innerHTML = `
            <div class="edit-field">
                <label style="font-size:0.7rem; color:var(--text-sub);">Título *</label>
                <input type="text" id="editTitle" value="${escapeHtml(item.title)}">
            </div>
            <div class="edit-field">
                <label style="font-size:0.7rem; color:var(--text-sub);">Enlace de video (YouTube)</label>
                <input type="text" id="editVideo" value="${escapeHtml(item.video || '')}" placeholder="https://youtube.com/...">
            </div>
            <div class="edit-field">
                <label style="font-size:0.7rem; color:var(--text-sub);">Enlace de documento</label>
                <input type="text" id="editDocLink" value="${escapeHtml(item.pdfUrl || '')}" placeholder="https://...">
            </div>
            <div class="edit-file-row">
                <div class="file-upload-wrapper" style="margin-bottom:8px;">
                    <button class="file-upload-btn" id="editFileTrigger">📂 Reemplazar archivo (imagen/video/pdf)</button>
                    <input type="file" id="editFileInput" class="file-upload-input" accept="image/*,video/*,application/pdf">
                </div>
                <div id="editFileName" style="font-size:0.7rem; color:var(--text-sub);">${item.fileName ? `Archivo actual: ${item.fileName}` : 'Sin archivo local'}</div>
            </div>
            <div>
                <button class="save-edit-btn" id="saveEditBtn">💾 Guardar cambios</button>
                <button class="cancel-edit-btn" id="cancelEditBtn">Cancelar</button>
            </div>
        `;
        cardElement.appendChild(editDiv);
        
        let newFileSelected = null;
        const fileInputEdit = editDiv.querySelector('#editFileInput');
        const fileTriggerEdit = editDiv.querySelector('#editFileTrigger');
        const fileNameSpan = editDiv.querySelector('#editFileName');
        
        fileInputEdit.addEventListener('change', () => {
            if (fileInputEdit.files.length > 0) {
                newFileSelected = fileInputEdit.files[0];
                fileNameSpan.textContent = `Nuevo archivo: ${newFileSelected.name}`;
                fileTriggerEdit.textContent = '✅ Archivo seleccionado';
            }
        });
        
        editDiv.querySelector('#saveEditBtn').onclick = async () => {
            const newTitle = editDiv.querySelector('#editTitle').value.trim();
            const newVideo = editDiv.querySelector('#editVideo').value.trim();
            const newDocLink = editDiv.querySelector('#editDocLink').value.trim();
            if (!newTitle) { alert("El título no puede estar vacío"); return; }
            
            const success = await updateResource(item.id, newTitle, newVideo, newDocLink, newFileSelected);
            if (success) {
                editingResourceId = null;
                renderMain();
            }
        };
        
        editDiv.querySelector('#cancelEditBtn').onclick = () => {
            editingResourceId = null;
            renderMain();
        };
    }
    
    // --- Renderizar principal ---
    function renderMain() {
        const container = document.getElementById('app-container');
        container.innerHTML = '';
        
        // Encabezado materia con botón editar
        const subjectHeader = document.createElement('div');
        subjectHeader.style.display = 'flex';
        subjectHeader.style.alignItems = 'center';
        subjectHeader.style.justifyContent = 'space-between';
        subjectHeader.style.marginBottom = '18px';
        subjectHeader.style.flexWrap = 'wrap';
        subjectHeader.style.gap = '10px';
        subjectHeader.innerHTML = `
            <h2 style="font-size: 1.6rem; font-weight: 600; color: var(--primary); margin:0;">${escapeHtml(currentSubject)}</h2>
            <button id="editSubjectBtn" style="background: none; border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 40px; cursor: pointer; font-size: 0.8rem; color: var(--text-sub);">✏️ Editar título</button>
        `;
        container.appendChild(subjectHeader);
        
        // Barra de búsqueda
        const searchDiv = document.createElement('div');
        searchDiv.className = 'search-bar';
        searchDiv.innerHTML = `<input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar por título..." value="${escapeHtml(searchTerm)}">`;
        container.appendChild(searchDiv);
        
        // Formulario para agregar recursos
        const addCard = document.createElement('div');
        addCard.className = 'add-card';
        addCard.innerHTML = `
            <div class="form-group">
                <label class="form-label">📌 Título del recurso *</label>
                <input type="text" id="resourceTitle" class="form-input" placeholder="Ej: Apuntes, Video clase, Imagen..." autocomplete="off">
            </div>
            <div class="form-group">
                <label class="form-label">🔗 Link de Video (YouTube, Vimeo, etc)</label>
                <input type="text" id="videoLink" class="form-input" placeholder="https://youtube.com/watch?v=...">
            </div>
            <div class="form-group">
                <label class="form-label">📎 Link de Documento (PDF, Drive, web)</label>
                <input type="text" id="docLink" class="form-input" placeholder="https://ejemplo.com/documento.pdf">
            </div>
            <div class="form-group">
                <label class="form-label">📂 Subir archivo (Imagen / Video / PDF)</label>
                <div class="file-upload-wrapper">
                    <button class="file-upload-btn" id="fileCustomBtn">📁 Seleccionar archivo</button>
                    <input type="file" id="localFileInput" class="file-upload-input" accept="image/*,video/*,application/pdf">
                </div>
                <div id="fileNameDisplay" style="font-size:0.75rem; margin-top:6px; color:#7f8c8d;"></div>
            </div>
            <button class="btn-submit" id="addResourceBtn">
                <span>➕ Agregar a ${escapeHtml(currentSubject)}</span>
            </button>
        `;
        container.appendChild(addCard);
        
        // Lógica archivo
        const fileInput = addCard.querySelector('#localFileInput');
        const fileBtn = addCard.querySelector('#fileCustomBtn');
        const fileNameSpan = addCard.querySelector('#fileNameDisplay');
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                const f = fileInput.files[0];
                fileNameSpan.innerText = `📎 ${f.name} (${(f.size/1024).toFixed(1)} KB)`;
                fileBtn.innerText = "✅ Archivo seleccionado";
            } else {
                fileNameSpan.innerText = "";
                fileBtn.innerText = "📁 Seleccionar archivo";
            }
        });
        
        // Botón agregar
        const addBtn = addCard.querySelector('#addResourceBtn');
        addBtn.onclick = async () => {
            const title = addCard.querySelector('#resourceTitle').value.trim();
            const videoLink = addCard.querySelector('#videoLink').value.trim();
            const docLink = addCard.querySelector('#docLink').value.trim();
            const localFile = fileInput.files[0];
            
            const success = await addResource(title, videoLink, docLink, localFile);
            if (success) {
                addCard.querySelector('#resourceTitle').value = '';
                addCard.querySelector('#videoLink').value = '';
                addCard.querySelector('#docLink').value = '';
                fileInput.value = '';
                fileNameSpan.innerText = '';
                fileBtn.innerText = "📁 Seleccionar archivo";
                renderMain();
            }
        };
        
        // Filtrar recursos por búsqueda
        let items = appData[currentSubject] || [];
        if (searchTerm.trim()) {
            const term = searchTerm.trim().toLowerCase();
            items = items.filter(item => item.title.toLowerCase().includes(term));
        }
        
        // Mostrar recursos (ordenados: primero el más antiguo debajo del header, último encima del footer)
        // Para mantener el orden: los primeros subidos aparecen primero, los últimos al final
        if (items.length === 0) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'empty-state';
            emptyDiv.innerHTML = searchTerm ? `🔍 No se encontraron recursos con "${escapeHtml(searchTerm)}"` : '📭 No hay documentos ni videos guardados. Agrega usando el formulario superior.';
            container.appendChild(emptyDiv);
        } else {
            // Orden cronológico: primero los más antiguos (para que el primer subido quede debajo del header)
            const sorted = [...items]; // mantener orden de inserción (los más antiguos primero)
            sorted.forEach(item => {
                const card = document.createElement('div');
                let typeClass = 'type-file';
                if (item.video) typeClass = 'type-video';
                else if (item.fileType === 'image') typeClass = 'type-image';
                else if (item.fileType === 'video') typeClass = 'type-video';
                
                card.className = `content-card ${typeClass} ${editingResourceId === item.id ? 'editing-mode' : ''}`;
                
                const previewHtml = renderResourcePreview(item);
                card.innerHTML = `
                    <div class="action-buttons">
                        <button class="icon-btn edit-btn" data-id="${item.id}">✏️</button>
                        <button class="icon-btn delete-btn" data-id="${item.id}">🗑️</button>
                    </div>
                    <div class="card-title">${escapeHtml(item.title)}</div>
                    ${previewHtml}
                `;
                container.appendChild(card);
                
                if (editingResourceId === item.id) {
                    renderEditMode(item, card);
                } else {
                    const editBtn = card.querySelector('.edit-btn');
                    const deleteBtn = card.querySelector('.delete-btn');
                    if (editBtn) editBtn.onclick = () => { editingResourceId = item.id; renderMain(); };
                    if (deleteBtn) deleteBtn.onclick = () => deleteResource(item.id);
                }
            });
        }
        
        // Eventos
        const editSubjectBtn = container.querySelector('#editSubjectBtn');
        if (editSubjectBtn) editSubjectBtn.onclick = showEditSubjectDialog;
        
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                searchTerm = e.target.value;
                renderMain();
            });
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Inicialización
    function init() {
        loadFromStorage();
        subjectsList.forEach(sub => {
            if (!appData[sub]) appData[sub] = [];
        });
        for (let key in appData) {
            if (!subjectsList.includes(key)) delete appData[key];
        }
        persistAll();
        currentSubject = subjectsList[0];
        renderNav();
        renderMain();
    }
    
    init();
</script>
</body>
</html>
